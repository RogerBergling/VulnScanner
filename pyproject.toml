[project]
name = "vulnscanner"
# Keep in sync with app/__init__.py.
version = "1.0.0"
description = "Local-first vulnerability scanner and management platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "python-multipart>=0.0.31,<1.0",
  "pydantic>=2.6,<3.0",
  "requests>=2.33,<3.0",
  "httpx>=0.27,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "cryptography>=50.0,<51.0",
  "paramiko>=4.0.1,<6.0",
  "pywinrm>=0.4.3,<1.0",
  "reportlab>=4.0,<6.0",
  "apscheduler>=3.10,<4.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1,<10.0",
]

[tool.uv]
# Keep the lock format stable across developer machines and CI.
required-version = ">=0.13"
