<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>VulnScanner</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#/dashboard" aria-label="VulnScanner dashboard">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 3l7 3v5.3c0 4.4-2.9 8.3-7 9.7-4.1-1.4-7-5.3-7-9.7V6l7-3z"/>
            <path d="M9.2 12.2l2 2 3.8-4.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-name">Vuln<span>Scanner</span></span>
      </a>
      <div class="topbar-center">
        <span class="env-chip" title="This instance runs on your local machine">LOCAL-FIRST</span>
        <span id="active-badge" class="active-badge hidden" title="Active scans">
          <span class="spinner"></span><span id="active-count">0</span> active
        </span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" id="top-new-scan" type="button">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
          New scan
        </button>
        <a class="icon-btn" href="#/help" title="Manual and help" aria-label="Help">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 114.2 2c-.9.7-1.8 1.2-1.8 2.6" stroke-linecap="round"/><circle cx="12" cy="17.2" r=".8" fill="currentColor" stroke="none"/></svg>
        </a>
        <a class="icon-btn" href="#/settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1-2.7 2.7-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6V21h-3.8v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1L4.6 17l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.6-1H3.2v-3.8h.2a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9L4.6 7 7.3 4.3l.1.1a1.7 1.7 0 001.9.3 1.7 1.7 0 001-1.6V3h3.8v.1a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 00-.3 1.9 1.7 1.7 0 001.6 1h.2v3.8H21a1.7 1.7 0 00-1.6 1.2z"/></svg>
        </a>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="Primary navigation">
        <nav class="nav">
          <a class="nav-link" href="#/dashboard" data-nav="dashboard">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
            <span>Dashboard</span>
          </a>
          <a class="nav-link" href="#/customers" data-nav="customers">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20v-1.5A3.5 3.5 0 017.5 15h4A3.5 3.5 0 0115 18.5V20"/><circle cx="9.5" cy="8" r="3.2"/><path d="M16 4.6a3 3 0 010 5.8M17.5 14.4a3.6 3.6 0 013 3.6V20"/></svg>
            <span>Customers</span>
          </a>
          <a class="nav-link" href="#/scans" data-nav="scans">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="18.5" cy="18" r="2.5"/></svg>
            <span>Scans</span>
          </a>
          <a class="nav-link" href="#/agents" data-nav="agents">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="17" height="11" rx="2"/><path d="M8 20h8M12 15.5V20"/><path d="M8.5 9.5l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Agents</span>
          </a>
          <a class="nav-link" href="#/ad" data-nav="ad">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l8 4v5c0 4.8-3.2 8.8-8 10-4.8-1.2-8-5.2-8-10V7l8-4z"/><circle cx="12" cy="10" r="2.2"/><path d="M8.3 16c.5-1.7 1.9-2.7 3.7-2.7s3.2 1 3.7 2.7"/></svg>
            <span>Active Directory</span>
          </a>
        </nav>
        <div class="nav-sep"></div>
        <nav class="nav">
          <a class="nav-link" href="#/server" data-nav="server">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4" width="17" height="6" rx="1.5"/><rect x="3.5" y="14" width="17" height="6" rx="1.5"/><circle cx="7.5" cy="7" r=".8" fill="currentColor" stroke="none"/><circle cx="7.5" cy="17" r=".8" fill="currentColor" stroke="none"/><path d="M12 7h5M12 17h5" stroke-linecap="round"/></svg>
            <span>Server</span>
          </a>
          <a class="nav-link" href="#/settings" data-nav="settings">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1-2.7 2.7-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6V21h-3.8v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1L4.6 17l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.6-1H3.2v-3.8h.2a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9L4.6 7 7.3 4.3l.1.1a1.7 1.7 0 001.9.3 1.7 1.7 0 001-1.6V3h3.8v.1a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 00-.3 1.9 1.7 1.7 0 001.6 1h.2v3.8H21a1.7 1.7 0 00-1.6 1.2z"/></svg>
            <span>Settings</span>
          </a>
          <a class="nav-link" href="#/help" data-nav="help">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 114.2 2c-.9.7-1.8 1.2-1.8 2.6" stroke-linecap="round"/><circle cx="12" cy="17.2" r=".8" fill="currentColor" stroke="none"/></svg>
            <span>Manual &amp; help</span>
          </a>
        </nav>
        <div class="sidebar-foot">
          <div class="sidebar-note">
            <strong>Authorized use only</strong>
            Scan systems you own or have written permission to test.
          </div>
          <div class="version-line">v<span id="app-version">1.0.0</span> · <a href="/manual" target="_blank" rel="noopener">Markdown manual</a></div>
        </div>
      </aside>

      <main id="view" class="view" tabindex="-1" aria-live="polite">
        <div class="loading-block"><span class="spinner dark"></span> Loading…</div>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <script src="/static/app.js"></script>
</body>
</html>
